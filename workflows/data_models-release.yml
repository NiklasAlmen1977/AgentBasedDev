name: Data Models Release

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - acc
          - prd

jobs:
  release:
    uses: group-analytics/ga_github_automation/.github/workflows/reusable-fabric-release.yml@main
    with:
      item_name: "lz036_data_models"
      target_environment: ${{ inputs.target_environment }}
      workspace_root: "Data_models"
      workspace_catalog_path: .github/config/catalog/workspaces.yml
      item_catalog_path: .github/config/catalog/items.yml
      common_parameter_path: .github/config/catalog/common-pq-parameters.yml
      release_config_path: .github/config/release/data_models.yml
    secrets: inherit
    permissions:
      contents: read
      packages: read
      id-token: write
      pull-requests: read