# Work areas of this repository, used by the work area guard of the ga-standards plugin.
# At session start Claude asks which work area you work on; edits in the blocked folders are
# stopped until you switch (type: work area: <name>). Delete this file to switch the guard off.
#
# work area name | folder        | blocked folders (space separated)
Engineering      | Engineering/  | Data_models/ Reports/
Data models      | Data_models/  | Engineering/
Reports          | Reports/      | Engineering/
